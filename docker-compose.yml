services:
  teslamate-mcp:
    build: .
    container_name: teslamate-mcp
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTH_TOKEN: ${AUTH_TOKEN:-}
      REPORT_TIMEZONE: ${REPORT_TIMEZONE:-UTC}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
