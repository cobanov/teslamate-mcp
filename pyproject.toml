[project]
name = "teslamate-mcp"
version = "0.3.0"
description = "A Model Context Protocol (MCP) server that exposes your TeslaMate database to AI assistants over stdio and streamable HTTP."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Mert Cobanov", email = "mertcobanov@gmail.com" },
]
keywords = [
    "tesla",
    "teslamate",
    "mcp",
    "model-context-protocol",
    "ai",
    "assistant",
    "vehicle-data",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp[cli]>=1.10.1",
    "psycopg[binary]>=3.2.9",
    "psycopg-pool>=3.2.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.5",
    "click>=8.1.0",
    "uvicorn>=0.30.0",
    "starlette>=0.37.0",
]

[project.scripts]
teslamate-mcp = "teslamate_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/cobanov/teslamate-mcp"
Repository = "https://github.com/cobanov/teslamate-mcp"
Issues = "https://github.com/cobanov/teslamate-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teslamate_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/teslamate_mcp/queries" = "teslamate_mcp/queries"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["teslamate_mcp"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"
