<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Activity report</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; margin: 0; }
  .viz-root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1d8a63;
    --series-4: #a256c9;
    --series-5: #c9375f;
    --series-6: #8a7a1d;
    --border: rgba(11,11,11,0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --grid: #2c2c2a;
      --baseline: #383835;
      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #27a578;
      --series-4: #b06bd6;
      --series-5: #d9527a;
      --series-6: #a89a3a;
      --border: rgba(255,255,255,0.10);
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --grid: #2c2c2a;
    --baseline: #383835;
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #27a578;
    --series-4: #b06bd6;
    --series-5: #d9527a;
    --series-6: #a89a3a;
    --border: rgba(255,255,255,0.10);
  }
  .viz-root {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--surface-1);
    color: var(--text-primary);
    padding: 14px 14px 10px;
  }
  header h1 { font-size: 14px; font-weight: 600; }
  header .sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .stats { display: flex; flex-wrap: wrap; gap: 18px; margin: 10px 0 4px; }
  .stat .v { font-size: 15px; font-weight: 600; }
  .stat .l { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 6px; font-size: 12px; }
  .legend .item { display: flex; align-items: center; gap: 6px; color: var(--text-secondary); }
  .legend .key { width: 12px; height: 0; border-top: 2.5px solid; flex: none; }
  .chart-wrap { position: relative; margin-top: 6px; }
  svg { display: block; width: 100%; }
  svg:focus { outline: 1.5px solid var(--series-1); outline-offset: 2px; border-radius: 2px; }
  .tick-label { font-size: 10px; fill: var(--text-muted); font-variant-numeric: tabular-nums; }
  .panel-title { font-size: 11px; fill: var(--text-secondary); font-weight: 600; }
  .grid-line { stroke: var(--grid); stroke-width: 1; }
  .base-line { stroke: var(--baseline); stroke-width: 1; }
  .series-line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .crosshair { stroke: var(--baseline); stroke-width: 1; stroke-dasharray: 3 3; }
  .hover-dot { stroke: var(--surface-1); stroke-width: 2; }
  .tooltip {
    position: absolute; top: 0; left: 0; pointer-events: none; display: none;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 6px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12); padding: 7px 10px; font-size: 12px;
    min-width: 150px; z-index: 2;
  }
  .tooltip .t { color: var(--text-muted); font-size: 11px; margin-bottom: 4px; font-variant-numeric: tabular-nums; }
  .tooltip .row { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
  .tooltip .key { width: 10px; height: 0; border-top: 2px solid; flex: none; }
  .tooltip .val { font-weight: 600; font-variant-numeric: tabular-nums; }
  .tooltip .lab { color: var(--text-secondary); font-size: 11px; }
  .state { padding: 24px 4px; font-size: 13px; color: var(--text-secondary); }
  details { margin-top: 8px; border-top: 1px solid var(--border); padding-top: 6px; }
  summary { font-size: 12px; color: var(--text-secondary); cursor: pointer; }
  table { border-collapse: collapse; width: 100%; margin-top: 6px; font-size: 11px; }
  th, td { text-align: right; padding: 3px 8px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--text-muted); font-weight: 600; }
  .bar { opacity: 0.85; }
  .bar-hover { opacity: 1; }
  .series-dot { stroke: var(--surface-1); stroke-width: 1.5; }
</style>
</head>
<body>
<div class="viz-root" id="root">
  <header>
    <h1 id="title">Activity report</h1>
    <div class="sub" id="subtitle">Waiting for data…</div>
  </header>
  <div class="stats" id="stats" hidden></div>
  <div class="chart-wrap" id="chartWrap" hidden>
    <svg id="chart" role="img" tabindex="0" aria-label="Distance, consumption, and charging per day or month. Use arrow keys to inspect each one."></svg>
    <div class="tooltip" id="tooltip"></div>
  </div>
  <div class="state" id="state">Waiting for the report…</div>
  <details id="tableWrap" hidden>
    <summary>Data table</summary>
    <div id="tableBox" style="overflow-x:auto"></div>
  </details>
</div>
<script>
"use strict";
/* ---------- MCP Apps bridge (ext-apps 2026-01-26, JSON-RPC over postMessage) ---------- */
let nextId = 1;
const pending = new Map();

function post(msg) { window.parent.postMessage(msg, "*"); }
function request(method, params) {
  const id = nextId++;
  return new Promise((resolve, reject) => {
    pending.set(id, { resolve, reject });
    post({ jsonrpc: "2.0", id, method, params });
  });
}
function notify(method, params) { post({ jsonrpc: "2.0", method, params: params || {} }); }

function applyTheme(theme) {
  if (theme === "dark" || theme === "light") {
    document.documentElement.dataset.theme = theme;
  }
}

window.addEventListener("message", (event) => {
  const msg = event.data;
  if (!msg || msg.jsonrpc !== "2.0") return;
  if (msg.id !== undefined && (msg.result !== undefined || msg.error !== undefined)) {
    const p = pending.get(msg.id);
    if (p) { pending.delete(msg.id); msg.error ? p.reject(msg.error) : p.resolve(msg.result); }
    return;
  }
  if (msg.method === "ui/notifications/tool-result") { onToolResult(msg.params || {}); return; }
  if (msg.method === "ui/notifications/tool-input") {
    onToolInput((msg.params && msg.params.arguments) || {}); return;
  }
  if (msg.method === "ui/notifications/tool-cancelled") {
    showState("Tool call was cancelled."); return;
  }
  if (msg.method === "ui/notifications/host-context-changed") {
    const p = msg.params || {};
    if (p.theme) applyTheme(p.theme);
    if (p.containerDimensions) render();
    return;
  }
  if (msg.method === "ui/resource-teardown" && msg.id !== undefined) {
    post({ jsonrpc: "2.0", id: msg.id, result: {} });
    return;
  }
  if (msg.method === "ping" && msg.id !== undefined) {
    post({ jsonrpc: "2.0", id: msg.id, result: {} });
    return;
  }
  // Answer any other host request so it fails fast instead of timing out.
  if (msg.method && msg.id !== undefined) {
    post({ jsonrpc: "2.0", id: msg.id, error: { code: -32601, message: "Method not found" } });
  }
});

// Params per McpUiInitializeRequest (ext-apps 2026-01-26): appInfo,
// appCapabilities and protocolVersion are all required. Hosts validate them
// and send tool-input/tool-result only after `initialized`, so a rejected
// handshake leaves the view empty.
request("ui/initialize", {
  protocolVersion: "2026-01-26",
  appInfo: { name: "teslamate-activity-report", version: "1.0.0" },
  appCapabilities: {},
}).then((res) => {
  const hc = (res && res.hostContext) || {};
  if (hc.theme) applyTheme(hc.theme);
  notify("ui/notifications/initialized");
  render();
}).catch((err) => {
  console.error("[teslamate] ui/initialize rejected by host:", err);
  showState("The chart could not connect to the host.");
});

/* ---------- data handling ---------- */
let rows = [];
let hoverIndex = -1;
let carName = null;

function onToolInput(args) {
  carName = args && args.car_name ? args.car_name : null;
}

/* Rows come from structuredContent.result; hosts that pass the result through
   without it still get the same rows as text blocks (one JSON object per row,
   or one JSON array), so parse those as a fallback. */
function extractRows(result) {
  const sc = result.structuredContent;
  if (sc && Array.isArray(sc.result)) return sc.result;
  const out = [];
  for (const block of result.content || []) {
    if (!block || block.type !== "text" || typeof block.text !== "string") continue;
    try {
      const v = JSON.parse(block.text);
      if (Array.isArray(v)) out.push(...v.filter((r) => r && typeof r === "object"));
      else if (v && typeof v === "object") out.push(v);
    } catch (_) { /* not JSON: ignore */ }
  }
  return out;
}

function onToolResult(result) {
  if (result.isError) {
    const text = (result.content || []).map((c) => c.text || "").join(" ");
    showState("Could not load the report. " + text);
    return;
  }
  rows = extractRows(result).filter((r) => typeof r.bucket === "string");
  if (!rows.length) {
    showState("Nothing to report for this period.");
    return;
  }
  document.getElementById("state").hidden = true;
  document.getElementById("stats").hidden = false;
  document.getElementById("chartWrap").hidden = false;
  document.getElementById("tableWrap").hidden = false;
  renderStats();
  renderTable();
  render();
}

function showState(text) {
  const el = document.getElementById("state");
  el.hidden = false;
  el.textContent = text;
  reportSize();
}
function setText(id, text) { document.getElementById(id).textContent = text; }

/* ---------- model ---------- */
// Buckets are local calendar days (YYYY-MM-DD) or months (YYYY-MM); format
// them in UTC so a label never shifts into the neighbouring day or month.
function isMonthly() { return rows.length > 0 && rows[0].bucket.length === 7; }
function bucketDate(b) { return new Date(b.length === 7 ? b + "-01T00:00:00Z" : b + "T00:00:00Z"); }
const fmtMonthShort = new Intl.DateTimeFormat(undefined, { month: "short", timeZone: "UTC" });
const fmtMonthLong = new Intl.DateTimeFormat(undefined, { month: "long", year: "numeric", timeZone: "UTC" });
const fmtDayLong = new Intl.DateTimeFormat(undefined, { weekday: "short", day: "numeric", month: "short", timeZone: "UTC" });
function tickLabel(b) {
  const d = bucketDate(b);
  return isMonthly() ? fmtMonthShort.format(d) : String(d.getUTCDate());
}
function longLabel(b) {
  const d = bucketDate(b);
  return isMonthly() ? fmtMonthLong.format(d) : fmtDayLong.format(d);
}
const num = (v) => (v == null ? 0 : Number(v));
function sum(key) { return rows.reduce((a, r) => a + num(r[key]), 0); }
function fmt(v, digits) {
  return Number(v).toLocaleString(undefined, { maximumFractionDigits: digits, minimumFractionDigits: 0 });
}

function renderStats() {
  const km = sum("distance_km"), kwh = sum("energy_used_kwh");
  const drives = sum("drives"), hours = sum("driving_hours");
  const added = sum("kwh_added"), sessions = sum("charging_sessions");
  const costRows = rows.filter((r) => r.charging_cost != null);
  const tempRows = rows.filter((r) => r.avg_outside_temp != null && num(r.driving_hours) > 0);
  const stats = [
    [fmt(km, 0) + " km", drives + (drives === 1 ? " drive" : " drives")],
    [fmt(hours, 1) + " h", "Driving time"],
    [km > 0 ? fmt((kwh * 1000) / km, 0) + " Wh/km" : "–", fmt(kwh, 0) + " kWh used"],
    [fmt(added, 0) + " kWh", sessions + (sessions === 1 ? " charge" : " charges")],
  ];
  if (costRows.length) {
    stats.push([fmt(costRows.reduce((a, r) => a + num(r.charging_cost), 0), 2), "Recorded charging cost"]);
  }
  if (tempRows.length) {
    const w = tempRows.reduce((a, r) => a + num(r.driving_hours), 0);
    const t = tempRows.reduce((a, r) => a + num(r.avg_outside_temp) * num(r.driving_hours), 0) / w;
    stats.push([fmt(t, 1) + " °C", "Average outside temperature"]);
  }
  const box = document.getElementById("stats");
  box.replaceChildren(...stats.map(([v, l]) => {
    const d = document.createElement("div");
    d.className = "stat";
    const dv = document.createElement("div"); dv.className = "v"; dv.textContent = v;
    const dl = document.createElement("div"); dl.className = "l"; dl.textContent = l;
    d.append(dv, dl);
    return d;
  }));
  const first = bucketDate(rows[0].bucket);
  const period = isMonthly() ? String(first.getUTCFullYear()) : fmtMonthLong.format(first);
  setText("title", "Activity report · " + period);
  setText("subtitle", (isMonthly() ? "Per month" : "Per day") + (carName ? ' · cars matching "' + carName + '"' : " · all cars"));
}

function renderTable() {
  const cols = [
    ["bucket", isMonthly() ? "Month" : "Day"], ["drives", "Drives"], ["distance_km", "km"],
    ["wh_per_km", "Wh/km"], ["charging_sessions", "Charges"], ["kwh_added", "kWh added"],
    ["charging_cost", "Cost"], ["avg_outside_temp", "°C"],
  ];
  const table = document.createElement("table");
  const thead = document.createElement("thead");
  const hr = document.createElement("tr");
  hr.append(...cols.map(([, label]) => {
    const th = document.createElement("th"); th.textContent = label; return th;
  }));
  thead.append(hr);
  const tbody = document.createElement("tbody");
  for (const r of rows) {
    const tr = document.createElement("tr");
    tr.append(...cols.map(([key]) => {
      const td = document.createElement("td");
      const v = r[key];
      td.textContent = key === "bucket" ? longLabel(v) : (v == null ? "–" : String(v));
      return td;
    }));
    tbody.append(tr);
  }
  table.append(thead, tbody);
  document.getElementById("tableBox").replaceChildren(table);
}

/* ---------- chart ---------- */
const NS = "http://www.w3.org/2000/svg";
const M = { left: 46, right: 14, top: 18, gap: 30, xAxis: 20 };
const PANELS = [
  { key: "distance_km", title: "Distance (km)", kind: "bar", color: "var(--series-1)", h: 120 },
  { key: "wh_per_km", title: "Consumption (Wh/km)", kind: "line", color: "var(--series-2)", h: 90 },
  { key: "kwh_added", title: "Charged (kWh)", kind: "bar", color: "var(--series-3)", h: 90 },
];
let geom = null;

function el(name, attrs) {
  const node = document.createElementNS(NS, name);
  for (const k in attrs) node.setAttribute(k, attrs[k]);
  return node;
}
function niceTicks(min, max, count) {
  if (min === max) { min -= 1; max += 1; }
  const span = max - min;
  const step0 = span / Math.max(1, count);
  const mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 5, 10].map((m) => m * mag).find((s) => span / s <= count) || 10 * mag;
  const lo = Math.floor(min / step) * step;
  const ticks = [];
  for (let v = lo; v <= max + 1e-9; v += step) if (v >= min - 1e-9) ticks.push(+v.toFixed(6));
  return ticks;
}

function render() {
  if (!rows.length) { reportSize(); return; }
  const svg = document.getElementById("chart");
  const width = Math.max(280, svg.parentElement.clientWidth || 280);
  const plotW = width - M.left - M.right;
  const n = rows.length;
  const slot = plotW / n;
  const cx = (i) => M.left + slot * (i + 0.5);
  let top = M.top;
  const panels = PANELS.map((p) => {
    const vals = rows.map((r) => r[p.key]).filter((v) => v != null).map(Number);
    let lo = 0, hi = vals.length ? Math.max(...vals) * 1.1 : 1;
    if (p.kind === "line" && vals.length) {
      lo = Math.min(...vals);
      const pad = Math.max(5, (hi - lo) * 0.15);
      lo = Math.max(0, lo - pad); hi += pad;
    }
    if (hi <= lo) hi = lo + 1;
    const pTop = top;
    const panel = { ...p, top: pTop, lo, hi, y: (v) => pTop + p.h - ((v - lo) / (hi - lo)) * p.h };
    top += p.h + M.gap;
    return panel;
  });
  const height = top - M.gap + M.xAxis;
  svg.setAttribute("viewBox", "0 0 " + width + " " + height);
  svg.setAttribute("height", height);
  svg.replaceChildren();
  geom = { cx, slot, width, height, panels };

  for (const p of panels) {
    const title = el("text", { x: M.left, y: p.top - 6, class: "panel-title" });
    title.textContent = p.title;
    svg.append(title);
    for (const tv of niceTicks(p.lo, p.hi, 3)) {
      if (Math.abs(p.y(tv) - (p.top + p.h)) > 4) {
        svg.append(el("line", { x1: M.left, x2: width - M.right, y1: p.y(tv), y2: p.y(tv), class: "grid-line" }));
      }
      const lab = el("text", { x: M.left - 6, y: p.y(tv) + 3, "text-anchor": "end", class: "tick-label" });
      lab.textContent = String(tv);
      svg.append(lab);
    }
    svg.append(el("line", { x1: M.left, x2: width - M.right, y1: p.top + p.h, y2: p.top + p.h, class: "base-line" }));
    if (p.kind === "bar") {
      const bw = Math.max(1, Math.min(28, slot * 0.7));
      rows.forEach((r, i) => {
        const v = num(r[p.key]);
        if (v <= 0) return;
        const y0 = p.y(v);
        svg.append(el("rect", {
          x: (cx(i) - bw / 2).toFixed(1), y: y0.toFixed(1), width: bw.toFixed(1),
          height: Math.max(1, p.top + p.h - y0).toFixed(1), rx: Math.min(2, bw / 4),
          fill: p.color, class: "bar",
        }));
      });
    } else {
      let d = "", prev = false;
      rows.forEach((r, i) => {
        const v = r[p.key];
        if (v == null) { prev = false; return; }
        d += (prev ? "L" : "M") + cx(i).toFixed(1) + " " + p.y(Number(v)).toFixed(1) + " ";
        prev = true;
      });
      svg.append(el("path", { d, class: "series-line", stroke: p.color }));
      rows.forEach((r, i) => {
        if (r[p.key] == null) return;
        svg.append(el("circle", { cx: cx(i), cy: p.y(Number(r[p.key])), r: 2.5, fill: p.color, class: "series-dot" }));
      });
    }
  }

  // Day numbers or month names under the last panel, thinned to fit.
  const stride = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(plotW / 34))));
  rows.forEach((r, i) => {
    if (i % stride !== 0 && i !== n - 1) return;
    if (i === n - 1 && i % stride !== 0 && (i % stride) < stride / 2) return;
    const lab = el("text", { x: cx(i), y: height - 5, "text-anchor": "middle", class: "tick-label" });
    lab.textContent = tickLabel(r.bucket);
    svg.append(lab);
  });

  const hover = el("g", { id: "hoverLayer", style: "display:none" });
  hover.append(el("rect", { id: "hoverBand", y: M.top, height: height - M.top - M.xAxis, fill: "var(--grid)", opacity: 0.5 }));
  svg.insertBefore(hover, svg.firstChild);
  bindPointer(svg);
  if (hoverIndex >= 0) showHover(hoverIndex);
  reportSize();
}

function bindPointer(svg) {
  svg.onpointermove = (ev) => {
    const rect = svg.getBoundingClientRect();
    const px = ((ev.clientX - rect.left) / rect.width) * geom.width;
    const i = Math.max(0, Math.min(rows.length - 1, Math.floor((px - M.left) / geom.slot)));
    showHover(i);
  };
  svg.onpointerleave = () => hideHover();
  svg.onkeydown = (ev) => {
    const last = rows.length - 1;
    let i = hoverIndex < 0 ? 0 : hoverIndex;
    if (ev.key === "ArrowRight") i = Math.min(last, i + 1);
    else if (ev.key === "ArrowLeft") i = Math.max(0, i - 1);
    else if (ev.key === "Home") i = 0;
    else if (ev.key === "End") i = last;
    else if (ev.key === "Escape") { hideHover(); return; }
    else return;
    ev.preventDefault();
    showHover(i);
  };
}

function showHover(i) {
  hoverIndex = i;
  const r = rows[i];
  const layer = document.getElementById("hoverLayer");
  layer.style.display = "";
  const band = document.getElementById("hoverBand");
  band.setAttribute("x", geom.cx(i) - geom.slot / 2);
  band.setAttribute("width", geom.slot);
  const tip = document.getElementById("tooltip");
  tip.replaceChildren();
  const t = document.createElement("div"); t.className = "t"; t.textContent = longLabel(r.bucket);
  tip.append(t);
  const lines = [
    [PANELS[0].color, r.distance_km + " km", r.drives + (r.drives === 1 ? " drive" : " drives")],
    [PANELS[1].color, r.wh_per_km == null ? "–" : r.wh_per_km + " Wh/km",
     r.avg_outside_temp == null ? "" : r.avg_outside_temp + " °C"],
    [PANELS[2].color, r.kwh_added + " kWh", r.charging_sessions + (r.charging_sessions === 1 ? " charge" : " charges")
      + (r.charging_cost != null ? " · cost " + r.charging_cost : "")],
  ];
  for (const [color, val, lab] of lines) {
    const row = document.createElement("div"); row.className = "row";
    const key = document.createElement("span"); key.className = "key"; key.style.borderTopColor = color;
    const v = document.createElement("span"); v.className = "val"; v.textContent = val;
    const l = document.createElement("span"); l.className = "lab"; l.textContent = lab;
    row.append(key, v, l);
    tip.append(row);
  }
  tip.style.display = "block";
  const wrap = document.getElementById("chartWrap");
  const svgEl = document.getElementById("chart");
  const scale = svgEl.getBoundingClientRect().width / geom.width;
  const pxLeft = geom.cx(i) * scale;
  const flip = pxLeft > wrap.clientWidth - tip.offsetWidth - 20;
  tip.style.left = (flip ? pxLeft - tip.offsetWidth - 14 : pxLeft + 14) + "px";
  tip.style.top = "24px";
}
function hideHover() {
  hoverIndex = -1;
  document.getElementById("hoverLayer").style.display = "none";
  document.getElementById("tooltip").style.display = "none";
}

/* ---------- sizing ---------- */
let sizeRaf = 0;
function reportSize() {
  cancelAnimationFrame(sizeRaf);
  sizeRaf = requestAnimationFrame(() => {
    notify("ui/notifications/size-changed", {
      width: document.documentElement.scrollWidth,
      height: document.documentElement.scrollHeight,
    });
  });
}
new ResizeObserver(() => { if (rows.length) render(); else reportSize(); })
  .observe(document.getElementById("root"));
document.getElementById("tableWrap").addEventListener("toggle", reportSize);
</script>
</body>
</html>
