<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Consumption by temperature</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; margin: 0; }
  .viz-root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1d8a63;
    --series-4: #a256c9;
    --series-5: #c9375f;
    --series-6: #8a7a1d;
    --border: rgba(11,11,11,0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --grid: #2c2c2a;
      --baseline: #383835;
      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #27a578;
      --series-4: #b06bd6;
      --series-5: #d9527a;
      --series-6: #a89a3a;
      --border: rgba(255,255,255,0.10);
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --grid: #2c2c2a;
    --baseline: #383835;
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #27a578;
    --series-4: #b06bd6;
    --series-5: #d9527a;
    --series-6: #a89a3a;
    --border: rgba(255,255,255,0.10);
  }
  .viz-root {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--surface-1);
    color: var(--text-primary);
    padding: 14px 14px 10px;
  }
  header h1 { font-size: 14px; font-weight: 600; }
  header .sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .stats { display: flex; flex-wrap: wrap; gap: 18px; margin: 10px 0 4px; }
  .stat .v { font-size: 15px; font-weight: 600; }
  .stat .l { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 6px; font-size: 12px; }
  .legend .item { display: flex; align-items: center; gap: 6px; color: var(--text-secondary); }
  .legend .key { width: 12px; height: 0; border-top: 2.5px solid; flex: none; }
  .chart-wrap { position: relative; margin-top: 6px; }
  svg { display: block; width: 100%; }
  svg:focus { outline: 1.5px solid var(--series-1); outline-offset: 2px; border-radius: 2px; }
  .tick-label { font-size: 10px; fill: var(--text-muted); font-variant-numeric: tabular-nums; }
  .panel-title { font-size: 11px; fill: var(--text-secondary); font-weight: 600; }
  .grid-line { stroke: var(--grid); stroke-width: 1; }
  .base-line { stroke: var(--baseline); stroke-width: 1; }
  .series-line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .crosshair { stroke: var(--baseline); stroke-width: 1; stroke-dasharray: 3 3; }
  .hover-dot { stroke: var(--surface-1); stroke-width: 2; }
  .tooltip {
    position: absolute; top: 0; left: 0; pointer-events: none; display: none;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 6px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12); padding: 7px 10px; font-size: 12px;
    min-width: 150px; z-index: 2;
  }
  .tooltip .t { color: var(--text-muted); font-size: 11px; margin-bottom: 4px; font-variant-numeric: tabular-nums; }
  .tooltip .row { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
  .tooltip .key { width: 10px; height: 0; border-top: 2px solid; flex: none; }
  .tooltip .val { font-weight: 600; font-variant-numeric: tabular-nums; }
  .tooltip .lab { color: var(--text-secondary); font-size: 11px; }
  .state { padding: 24px 4px; font-size: 13px; color: var(--text-secondary); }
  details { margin-top: 8px; border-top: 1px solid var(--border); padding-top: 6px; }
  summary { font-size: 12px; color: var(--text-secondary); cursor: pointer; }
  table { border-collapse: collapse; width: 100%; margin-top: 6px; font-size: 11px; }
  th, td { text-align: right; padding: 3px 8px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--text-muted); font-weight: 600; }
</style>
</head>
<body>
<div class="viz-root" id="root">
  <header>
    <h1 id="title">Consumption by outside temperature</h1>
    <div class="sub" id="subtitle">Waiting for data…</div>
  </header>
  <div class="stats" id="stats" hidden></div>
  <div class="legend" id="legend" hidden></div>
  <div class="chart-wrap" id="chartWrap" hidden>
    <svg id="chart" role="img" tabindex="0" aria-label="Consumption of each drive against outside temperature, with the 5-degree average. Use arrow keys to step through the temperature bands."></svg>
    <div class="tooltip" id="tooltip"></div>
  </div>
  <div class="state" id="state">Waiting for the drives…</div>
  <details id="tableWrap" hidden>
    <summary>By temperature band</summary>
    <div id="tableBox" style="overflow-x:auto"></div>
  </details>
</div>
<script>
"use strict";
/* ---------- MCP Apps bridge (ext-apps 2026-01-26, JSON-RPC over postMessage) ---------- */
let nextId = 1;
const pending = new Map();

function post(msg) { window.parent.postMessage(msg, "*"); }
function request(method, params) {
  const id = nextId++;
  return new Promise((resolve, reject) => {
    pending.set(id, { resolve, reject });
    post({ jsonrpc: "2.0", id, method, params });
  });
}
function notify(method, params) { post({ jsonrpc: "2.0", method, params: params || {} }); }

function applyTheme(theme) {
  if (theme === "dark" || theme === "light") {
    document.documentElement.dataset.theme = theme;
  }
}

window.addEventListener("message", (event) => {
  const msg = event.data;
  if (!msg || msg.jsonrpc !== "2.0") return;
  if (msg.id !== undefined && (msg.result !== undefined || msg.error !== undefined)) {
    const p = pending.get(msg.id);
    if (p) { pending.delete(msg.id); msg.error ? p.reject(msg.error) : p.resolve(msg.result); }
    return;
  }
  if (msg.method === "ui/notifications/tool-result") { onToolResult(msg.params || {}); return; }
  if (msg.method === "ui/notifications/tool-input") {
    onToolInput((msg.params && msg.params.arguments) || {}); return;
  }
  if (msg.method === "ui/notifications/tool-cancelled") {
    showState("Tool call was cancelled."); return;
  }
  if (msg.method === "ui/notifications/host-context-changed") {
    const p = msg.params || {};
    if (p.theme) applyTheme(p.theme);
    if (p.containerDimensions) render();
    return;
  }
  if (msg.method === "ui/resource-teardown" && msg.id !== undefined) {
    post({ jsonrpc: "2.0", id: msg.id, result: {} });
    return;
  }
  if (msg.method === "ping" && msg.id !== undefined) {
    post({ jsonrpc: "2.0", id: msg.id, result: {} });
    return;
  }
  // Answer any other host request so it fails fast instead of timing out.
  if (msg.method && msg.id !== undefined) {
    post({ jsonrpc: "2.0", id: msg.id, error: { code: -32601, message: "Method not found" } });
  }
});

// Params per McpUiInitializeRequest (ext-apps 2026-01-26): appInfo,
// appCapabilities and protocolVersion are all required. Hosts validate them
// and send tool-input/tool-result only after `initialized`, so a rejected
// handshake leaves the view empty.
request("ui/initialize", {
  protocolVersion: "2026-01-26",
  appInfo: { name: "teslamate-efficiency-vs-temperature", version: "1.0.0" },
  appCapabilities: {},
}).then((res) => {
  const hc = (res && res.hostContext) || {};
  if (hc.theme) applyTheme(hc.theme);
  notify("ui/notifications/initialized");
  render();
}).catch((err) => {
  console.error("[teslamate] ui/initialize rejected by host:", err);
  showState("The chart could not connect to the host.");
});

/* ---------- data handling ---------- */
let rows = [];
let hoverIndex = -1;

function onToolInput(args) {
  const bits = [];
  if (args && args.car_name) bits.push('cars matching "' + args.car_name + '"');
  if (args && args.days) bits.push("last " + args.days + " days");
  if (bits.length) setText("subtitle", bits.join(" · "));
}

/* Rows come from structuredContent.result; hosts that pass the result through
   without it still get the same rows as text blocks (one JSON object per row,
   or one JSON array), so parse those as a fallback. */
function extractRows(result) {
  const sc = result.structuredContent;
  if (sc && Array.isArray(sc.result)) return sc.result;
  const out = [];
  for (const block of result.content || []) {
    if (!block || block.type !== "text" || typeof block.text !== "string") continue;
    try {
      const v = JSON.parse(block.text);
      if (Array.isArray(v)) out.push(...v.filter((r) => r && typeof r === "object"));
      else if (v && typeof v === "object") out.push(v);
    } catch (_) { /* not JSON: ignore */ }
  }
  return out;
}

function onToolResult(result) {
  if (result.isError) {
    const text = (result.content || []).map((c) => c.text || "").join(" ");
    showState("Could not load the drives. " + text);
    return;
  }
  rows = extractRows(result);
  buildModel();
  if (!points.length) {
    showState("No drives with temperature and consumption data found.");
    return;
  }
  document.getElementById("state").hidden = true;
  document.getElementById("stats").hidden = false;
  document.getElementById("legend").hidden = false;
  document.getElementById("chartWrap").hidden = false;
  document.getElementById("tableWrap").hidden = false;
  renderStats();
  renderLegend();
  renderTable();
  render();
}

function showState(text) {
  const el = document.getElementById("state");
  el.hidden = false;
  el.textContent = text;
  reportSize();
}
function setText(id, text) { document.getElementById(id).textContent = text; }

/* ---------- model ---------- */
let points = []; // {id, car, t, wh, km, speed, date, color}
let cars = [];   // {name, color}
let bands = [];  // 5-degree bands: {lo, hi, mid, wh, km, n}; mid is the band's weighted mean temperature
const BAND = 5;

function parseUtc(s) {
  if (typeof s !== "string") return null;
  const iso = /(Z|[+-]\d\d:?\d\d)$/.test(s) ? s : s + "Z"; // TeslaMate stores naive UTC
  const d = new Date(iso);
  return isNaN(d.getTime()) ? null : d;
}

function buildModel() {
  const names = [...new Set(rows.map((r) => r.car_name))];
  cars = names.map((name, i) => ({ name, color: "var(--series-" + ((i % 6) + 1) + ")" }));
  const colorOf = new Map(cars.map((c) => [c.name, c.color]));
  points = rows
    .filter((r) => r.outside_temp != null && r.wh_per_km != null)
    .map((r) => ({
      id: r.drive_id, car: r.car_name, t: Number(r.outside_temp), wh: Number(r.wh_per_km),
      km: Number(r.distance_km || 0), speed: r.avg_speed_kmh, date: parseUtc(r.start_date),
      color: colorOf.get(r.car_name),
    }));
  // Distance-weighted consumption per 5-degree band, all cars together.
  const byBand = new Map();
  for (const p of points) {
    const lo = Math.floor(p.t / BAND) * BAND;
    const b = byBand.get(lo) || { lo, hi: lo + BAND, tKm: 0, whKm: 0, km: 0, n: 0 };
    b.whKm += p.wh * p.km; b.tKm += p.t * p.km; b.km += p.km; b.n += 1;
    byBand.set(lo, b);
  }
  bands = [...byBand.values()]
    .filter((b) => b.km > 0)
    .map((b) => ({ ...b, wh: b.whKm / b.km, mid: b.tKm / b.km }))
    .sort((a, b) => a.lo - b.lo);
}

function weighted(filter) {
  let whKm = 0, km = 0;
  for (const p of points) if (filter(p)) { whKm += p.wh * p.km; km += p.km; }
  return km > 0 ? whKm / km : null;
}
const fmtDate = new Intl.DateTimeFormat(undefined, { day: "numeric", month: "short", year: "numeric" });

function renderStats() {
  const all = weighted(() => true);
  const cold = weighted((p) => p.t < 5);
  const mild = weighted((p) => p.t >= 15 && p.t <= 25);
  const stats = [
    [String(points.length), "Drives"],
    [all == null ? "–" : Math.round(all) + " Wh/km", "Average consumption"],
  ];
  if (cold != null && mild != null) {
    const pct = (cold / mild - 1) * 100;
    stats.push([(pct >= 0 ? "+" : "") + pct.toFixed(0) + "%", "Below 5 °C vs 15–25 °C"]);
  }
  if (bands.length) {
    const best = bands.reduce((a, b) => (b.n >= 3 && (!a || b.wh < a.wh) ? b : a), null);
    if (best) stats.push([best.lo + "–" + best.hi + " °C", "Most efficient band (" + Math.round(best.wh) + " Wh/km)"]);
  }
  const box = document.getElementById("stats");
  box.replaceChildren(...stats.map(([v, l]) => {
    const d = document.createElement("div");
    d.className = "stat";
    const dv = document.createElement("div"); dv.className = "v"; dv.textContent = v;
    const dl = document.createElement("div"); dl.className = "l"; dl.textContent = l;
    d.append(dv, dl);
    return d;
  }));
  if (document.getElementById("subtitle").textContent === "Waiting for data…") {
    setText("subtitle", "One dot per drive, sized by distance");
  }
}

function renderLegend() {
  const box = document.getElementById("legend");
  const items = cars.length > 1 ? cars.map((c) => [c.color, c.name, "dot"]) : [];
  items.push(["var(--text-secondary)", BAND + " °C average (distance-weighted)", "line"]);
  box.replaceChildren(...items.map(([color, label, kind]) => {
    const item = document.createElement("div"); item.className = "item";
    const key = document.createElement("span"); key.className = "key";
    if (kind === "dot") {
      key.style.cssText = "width:9px;height:9px;border:0;border-radius:50%;background:" + color;
    } else {
      key.style.borderTopColor = color;
    }
    const lab = document.createElement("span"); lab.textContent = label;
    item.append(key, lab);
    return item;
  }));
}

function renderTable() {
  const cols = ["Outside temperature", "Drives", "km", "Wh/km"];
  const table = document.createElement("table");
  const thead = document.createElement("thead");
  const hr = document.createElement("tr");
  hr.append(...cols.map((label) => {
    const th = document.createElement("th"); th.textContent = label; return th;
  }));
  thead.append(hr);
  const tbody = document.createElement("tbody");
  for (const b of bands) {
    const tr = document.createElement("tr");
    for (const v of [b.lo + " to " + b.hi + " °C", b.n, b.km.toFixed(0), Math.round(b.wh)]) {
      const td = document.createElement("td");
      td.textContent = String(v);
      tr.append(td);
    }
    tbody.append(tr);
  }
  table.append(thead, tbody);
  document.getElementById("tableBox").replaceChildren(table);
}

/* ---------- chart ---------- */
const NS = "http://www.w3.org/2000/svg";
const M = { left: 46, right: 14, top: 18, xAxis: 30 };
const PANEL_H = 240;
let geom = null;

function el(name, attrs) {
  const node = document.createElementNS(NS, name);
  for (const k in attrs) node.setAttribute(k, attrs[k]);
  return node;
}
function niceTicks(min, max, count) {
  if (min === max) { min -= 1; max += 1; }
  const span = max - min;
  const step0 = span / Math.max(1, count);
  const mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 5, 10].map((m) => m * mag).find((s) => span / s <= count) || 10 * mag;
  const lo = Math.floor(min / step) * step;
  const ticks = [];
  for (let v = lo; v <= max + 1e-9; v += step) if (v >= min - 1e-9) ticks.push(+v.toFixed(6));
  return ticks;
}
function radius(p, maxKm) { return 2.5 + 5 * Math.sqrt(p.km / (maxKm || 1)); }

function render() {
  if (!points.length) { reportSize(); return; }
  const svg = document.getElementById("chart");
  const width = Math.max(280, svg.parentElement.clientWidth || 280);
  const height = M.top + PANEL_H + M.xAxis;
  svg.setAttribute("viewBox", "0 0 " + width + " " + height);
  svg.setAttribute("height", height);
  svg.replaceChildren();

  const ts = points.map((p) => p.t), whs = points.map((p) => p.wh);
  const tLo = Math.floor(Math.min(...ts) / BAND) * BAND, tHi = Math.ceil(Math.max(...ts) / BAND) * BAND;
  const whPad = Math.max(10, (Math.max(...whs) - Math.min(...whs)) * 0.08);
  const whLo = Math.max(0, Math.min(...whs) - whPad), whHi = Math.max(...whs) + whPad;
  const plotW = width - M.left - M.right;
  const x = (t) => M.left + (tHi === tLo ? plotW / 2 : ((t - tLo) / (tHi - tLo)) * plotW);
  const y = (v) => M.top + PANEL_H - ((v - whLo) / (whHi - whLo)) * PANEL_H;
  const maxKm = Math.max(...points.map((p) => p.km));
  geom = { x, y, width, height, maxKm };

  const title = el("text", { x: M.left, y: M.top - 6, class: "panel-title" });
  title.textContent = "Consumption (Wh/km)";
  svg.append(title);
  for (const tv of niceTicks(whLo, whHi, 5)) {
    svg.append(el("line", { x1: M.left, x2: width - M.right, y1: y(tv), y2: y(tv), class: "grid-line" }));
    const lab = el("text", { x: M.left - 6, y: y(tv) + 3, "text-anchor": "end", class: "tick-label" });
    lab.textContent = String(tv);
    svg.append(lab);
  }
  svg.append(el("line", { x1: M.left, x2: width - M.right, y1: M.top + PANEL_H, y2: M.top + PANEL_H, class: "base-line" }));
  for (const tv of niceTicks(tLo, tHi, Math.max(3, Math.floor(plotW / 60)))) {
    const lab = el("text", { x: x(tv), y: M.top + PANEL_H + 15, "text-anchor": "middle", class: "tick-label" });
    lab.textContent = tv + "°";
    svg.append(lab);
  }
  const axisTitle = el("text", { x: width - M.right, y: M.top + PANEL_H + 28, "text-anchor": "end", class: "tick-label" });
  axisTitle.textContent = "Outside temperature (°C)";
  svg.append(axisTitle);

  // Biggest drives first so short ones stay visible on top.
  const order = points.map((p, i) => i).sort((a, b) => points[b].km - points[a].km);
  for (const i of order) {
    const p = points[i];
    svg.append(el("circle", {
      cx: x(p.t).toFixed(1), cy: y(p.wh).toFixed(1), r: radius(p, maxKm).toFixed(1),
      fill: p.color, "fill-opacity": 0.45, stroke: p.color, "stroke-opacity": 0.8, "stroke-width": 1,
    }));
  }

  if (bands.length > 1) {
    const d = bands.map((b, i) => (i ? "L" : "M") + x(b.mid).toFixed(1) + " " + y(b.wh).toFixed(1)).join(" ");
    svg.append(el("path", { d, class: "series-line", stroke: "var(--text-secondary)", "stroke-dasharray": "5 3" }));
  }
  for (const b of bands) {
    svg.append(el("circle", { cx: x(b.mid), cy: y(b.wh), r: 3.5, fill: "var(--text-secondary)", class: "hover-dot" }));
  }

  const hover = el("g", { id: "hoverLayer", style: "display:none" });
  hover.append(el("circle", { id: "hoverRing", fill: "none", stroke: "var(--text-primary)", "stroke-width": 2 }));
  svg.append(hover);
  bindPointer(svg);
  if (hoverIndex >= 0) showHover(hoverIndex);
  reportSize();
}

function bindPointer(svg) {
  svg.onpointermove = (ev) => {
    const rect = svg.getBoundingClientRect();
    const px = ((ev.clientX - rect.left) / rect.width) * geom.width;
    const py = ((ev.clientY - rect.top) / rect.height) * geom.height;
    let best = -1, bestDist = Infinity;
    points.forEach((p, i) => {
      const dx = geom.x(p.t) - px, dy = geom.y(p.wh) - py;
      const d = dx * dx + dy * dy;
      if (d < bestDist) { bestDist = d; best = i; }
    });
    if (best < 0 || bestDist > 400) hideHover(); else showHover(best);
  };
  svg.onpointerleave = () => hideHover();
  // Keys step through drives from coldest to warmest.
  svg.onkeydown = (ev) => {
    const order = points.map((p, i) => i).sort((a, b) => points[a].t - points[b].t);
    let k = hoverIndex < 0 ? 0 : order.indexOf(hoverIndex);
    if (ev.key === "ArrowRight") k = Math.min(order.length - 1, k + 1);
    else if (ev.key === "ArrowLeft") k = Math.max(0, k - 1);
    else if (ev.key === "Home") k = 0;
    else if (ev.key === "End") k = order.length - 1;
    else if (ev.key === "Escape") { hideHover(); return; }
    else return;
    ev.preventDefault();
    showHover(order[k]);
  };
}

function showHover(i) {
  hoverIndex = i;
  const p = points[i];
  const cx = geom.x(p.t), cy = geom.y(p.wh);
  document.getElementById("hoverLayer").style.display = "";
  const ring = document.getElementById("hoverRing");
  ring.setAttribute("cx", cx); ring.setAttribute("cy", cy); ring.setAttribute("r", radius(p, geom.maxKm) + 2);
  const tip = document.getElementById("tooltip");
  tip.replaceChildren();
  const t = document.createElement("div"); t.className = "t";
  t.textContent = (p.date ? fmtDate.format(p.date) : "") + " · drive #" + p.id + (cars.length > 1 ? " · " + p.car : "");
  tip.append(t);
  for (const [val, lab] of [
    [p.wh + " Wh/km", "Consumption"],
    [p.t + " °C", "Outside"],
    [p.km + " km", "Distance"],
    [p.speed == null ? "–" : p.speed + " km/h", "Average speed"],
  ]) {
    const row = document.createElement("div"); row.className = "row";
    const l = document.createElement("span"); l.className = "lab"; l.textContent = lab;
    const v = document.createElement("span"); v.className = "val"; v.textContent = val;
    row.append(v, l);
    tip.append(row);
  }
  tip.style.display = "block";
  const wrap = document.getElementById("chartWrap");
  const svgEl = document.getElementById("chart");
  const scale = svgEl.getBoundingClientRect().width / geom.width;
  const pxLeft = cx * scale, pxTop = cy * scale;
  const flip = pxLeft > wrap.clientWidth - tip.offsetWidth - 20;
  tip.style.left = (flip ? pxLeft - tip.offsetWidth - 14 : pxLeft + 14) + "px";
  tip.style.top = Math.max(4, pxTop - tip.offsetHeight / 2) + "px";
}
function hideHover() {
  hoverIndex = -1;
  document.getElementById("hoverLayer").style.display = "none";
  document.getElementById("tooltip").style.display = "none";
}

/* ---------- sizing ---------- */
let sizeRaf = 0;
function reportSize() {
  cancelAnimationFrame(sizeRaf);
  sizeRaf = requestAnimationFrame(() => {
    notify("ui/notifications/size-changed", {
      width: document.documentElement.scrollWidth,
      height: document.documentElement.scrollHeight,
    });
  });
}
new ResizeObserver(() => { if (points.length) render(); else reportSize(); })
  .observe(document.getElementById("root"));
document.getElementById("tableWrap").addEventListener("toggle", reportSize);
</script>
</body>
