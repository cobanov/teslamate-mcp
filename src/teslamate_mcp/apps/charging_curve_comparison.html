<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Charging curve comparison</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; margin: 0; }
  .viz-root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1d8a63;
    --series-4: #a256c9;
    --series-5: #c9375f;
    --series-6: #8a7a1d;
    --border: rgba(11,11,11,0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --grid: #2c2c2a;
      --baseline: #383835;
      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #27a578;
      --series-4: #b06bd6;
      --series-5: #d9527a;
      --series-6: #a89a3a;
      --border: rgba(255,255,255,0.10);
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --grid: #2c2c2a;
    --baseline: #383835;
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #27a578;
    --series-4: #b06bd6;
    --series-5: #d9527a;
    --series-6: #a89a3a;
    --border: rgba(255,255,255,0.10);
  }
  .viz-root {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--surface-1);
    color: var(--text-primary);
    padding: 14px 14px 10px;
  }
  header h1 { font-size: 14px; font-weight: 600; }
  header .sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .stats { display: flex; flex-wrap: wrap; gap: 18px; margin: 10px 0 4px; }
  .stat .v { font-size: 15px; font-weight: 600; }
  .stat .l { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 6px; font-size: 12px; }
  .legend { flex-direction: column; gap: 4px; }
  .legend .item { display: flex; align-items: center; gap: 6px; color: var(--text-secondary); }
  .legend .peak { color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .legend .key { width: 12px; height: 0; border-top: 2.5px solid; flex: none; }
  .chart-wrap { position: relative; margin-top: 6px; }
  svg { display: block; width: 100%; }
  svg:focus { outline: 1.5px solid var(--series-1); outline-offset: 2px; border-radius: 2px; }
  .tick-label { font-size: 10px; fill: var(--text-muted); font-variant-numeric: tabular-nums; }
  .panel-title { font-size: 11px; fill: var(--text-secondary); font-weight: 600; }
  .grid-line { stroke: var(--grid); stroke-width: 1; }
  .base-line { stroke: var(--baseline); stroke-width: 1; }
  .series-line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .crosshair { stroke: var(--baseline); stroke-width: 1; stroke-dasharray: 3 3; }
  .hover-dot { stroke: var(--surface-1); stroke-width: 2; }
  .tooltip {
    position: absolute; top: 0; left: 0; pointer-events: none; display: none;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 6px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12); padding: 7px 10px; font-size: 12px;
    min-width: 150px; z-index: 2;
  }
  .tooltip .t { color: var(--text-muted); font-size: 11px; margin-bottom: 4px; font-variant-numeric: tabular-nums; }
  .tooltip .row { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
  .tooltip .key { width: 10px; height: 0; border-top: 2px solid; flex: none; }
  .tooltip .val { font-weight: 600; font-variant-numeric: tabular-nums; }
  .tooltip .lab { color: var(--text-secondary); font-size: 11px; }
  .state { padding: 24px 4px; font-size: 13px; color: var(--text-secondary); }
  details { margin-top: 8px; border-top: 1px solid var(--border); padding-top: 6px; }
  summary { font-size: 12px; color: var(--text-secondary); cursor: pointer; }
  table { border-collapse: collapse; width: 100%; margin-top: 6px; font-size: 11px; }
  th, td { text-align: right; padding: 3px 8px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--text-muted); font-weight: 600; }
</style>
</head>
<body>
<div class="viz-root" id="root">
  <header>
    <h1 id="title">Charging curves by battery level</h1>
    <div class="sub" id="subtitle">Waiting for data…</div>
  </header>
  <div class="stats" id="stats" hidden></div>
  <div class="legend" id="legend" hidden></div>
  <div class="chart-wrap" id="chartWrap" hidden>
    <svg id="chart" role="img" tabindex="0" aria-label="Charging power by battery level, one line per session. Use arrow keys to inspect battery levels."></svg>
    <div class="tooltip" id="tooltip"></div>
  </div>
  <div class="state" id="state">Waiting for the charging curves…</div>
  <details id="tableWrap" hidden>
    <summary>Data table</summary>
    <div id="tableBox" style="overflow-x:auto"></div>
  </details>
</div>
<script>
"use strict";
/* ---------- MCP Apps bridge (ext-apps 2026-01-26, JSON-RPC over postMessage) ---------- */
let nextId = 1;
const pending = new Map();

function post(msg) { window.parent.postMessage(msg, "*"); }
function request(method, params) {
  const id = nextId++;
  return new Promise((resolve, reject) => {
    pending.set(id, { resolve, reject });
    post({ jsonrpc: "2.0", id, method, params });
  });
}
function notify(method, params) { post({ jsonrpc: "2.0", method, params: params || {} }); }

function applyTheme(theme) {
  if (theme === "dark" || theme === "light") {
    document.documentElement.dataset.theme = theme;
  }
}

window.addEventListener("message", (event) => {
  const msg = event.data;
  if (!msg || msg.jsonrpc !== "2.0") return;
  if (msg.id !== undefined && (msg.result !== undefined || msg.error !== undefined)) {
    const p = pending.get(msg.id);
    if (p) { pending.delete(msg.id); msg.error ? p.reject(msg.error) : p.resolve(msg.result); }
    return;
  }
  if (msg.method === "ui/notifications/tool-result") { onToolResult(msg.params || {}); return; }
  if (msg.method === "ui/notifications/tool-input") {
    onToolInput((msg.params && msg.params.arguments) || {}); return;
  }
  if (msg.method === "ui/notifications/tool-cancelled") {
    showState("Tool call was cancelled."); return;
  }
  if (msg.method === "ui/notifications/host-context-changed") {
    const p = msg.params || {};
    if (p.theme) applyTheme(p.theme);
    if (p.containerDimensions) render();
    return;
  }
  if (msg.method === "ui/resource-teardown" && msg.id !== undefined) {
    post({ jsonrpc: "2.0", id: msg.id, result: {} });
    return;
  }
  if (msg.method === "ping" && msg.id !== undefined) {
    post({ jsonrpc: "2.0", id: msg.id, result: {} });
    return;
  }
  // Answer any other host request so it fails fast instead of timing out.
  if (msg.method && msg.id !== undefined) {
    post({ jsonrpc: "2.0", id: msg.id, error: { code: -32601, message: "Method not found" } });
  }
});

// Params per McpUiInitializeRequest (ext-apps 2026-01-26): appInfo,
// appCapabilities and protocolVersion are all required. Hosts validate them
// and send tool-input/tool-result only after `initialized`, so a rejected
// handshake leaves the view empty.
request("ui/initialize", {
  protocolVersion: "2026-01-26",
  appInfo: { name: "teslamate-charging-curve-comparison", version: "1.0.0" },
  appCapabilities: {},
}).then((res) => {
  const hc = (res && res.hostContext) || {};
  if (hc.theme) applyTheme(hc.theme);
  notify("ui/notifications/initialized");
  render();
}).catch((err) => {
  console.error("[teslamate] ui/initialize rejected by host:", err);
  showState("The chart could not connect to the host.");
});

/* ---------- data handling ---------- */
let rows = [];
let hoverIndex = -1;

function onToolInput(args) {
  const bits = [];
  if (args && args.charging_process_ids) bits.push("sessions " + args.charging_process_ids);
  if (args && args.location) bits.push('at "' + args.location + '"');
  if (args && args.car_name) bits.push('cars matching "' + args.car_name + '"');
  if (bits.length) setText("subtitle", bits.join(" · "));
}

/* Rows come from structuredContent.result; hosts that pass the result through
   without it still get the same rows as text blocks (one JSON object per row,
   or one JSON array), so parse those as a fallback. */
function extractRows(result) {
  const sc = result.structuredContent;
  if (sc && Array.isArray(sc.result)) return sc.result;
  const out = [];
  for (const block of result.content || []) {
    if (!block || block.type !== "text" || typeof block.text !== "string") continue;
    try {
      const v = JSON.parse(block.text);
      if (Array.isArray(v)) out.push(...v.filter((r) => r && typeof r === "object"));
      else if (v && typeof v === "object") out.push(v);
    } catch (_) { /* not JSON: ignore */ }
  }
  return out;
}

function onToolResult(result) {
  if (result.isError) {
    const text = (result.content || []).map((c) => c.text || "").join(" ");
    showState("Could not load the charging curves. " + text);
    return;
  }
  rows = extractRows(result);
  buildModel();
  if (!levels.length) {
    showState("No charging samples found for these sessions.");
    return;
  }
  document.getElementById("state").hidden = true;
  document.getElementById("stats").hidden = false;
  document.getElementById("legend").hidden = false;
  document.getElementById("chartWrap").hidden = false;
  document.getElementById("tableWrap").hidden = false;
  renderStats();
  renderLegend();
  renderTable();
  render();
}

function showState(text) {
  const el = document.getElementById("state");
  el.hidden = false;
  el.textContent = text;
  reportSize();
}
function setText(id, text) { document.getElementById(id).textContent = text; }

/* ---------- model ---------- */
let series = []; // {id, label, type, color, byLevel: Map<level, {kw, max}>, peak}
let levels = []; // battery levels present in any session, ascending

const TYPE_LABEL = { supercharger: "Supercharger", other_dc: "DC", ac: "AC" };

function shortPlace(s) {
  if (!s) return "Unknown place";
  const first = String(s).split(",")[0].trim();
  return first.length > 38 ? first.slice(0, 37) + "…" : first;
}

function buildModel() {
  const byId = new Map();
  const levelSet = new Set();
  for (const r of rows) {
    if (r.battery_level == null || r.power_kw == null) continue;
    if (!byId.has(r.charging_process_id)) {
      byId.set(r.charging_process_id, {
        id: r.charging_process_id,
        label: (r.start_local || "") + " · " + shortPlace(r.location),
        type: TYPE_LABEL[r.charger_type] || r.charger_type || "",
        byLevel: new Map(),
        peak: 0,
      });
    }
    const s = byId.get(r.charging_process_id);
    s.byLevel.set(r.battery_level, { kw: r.power_kw, max: r.max_power_kw });
    s.peak = Math.max(s.peak, r.max_power_kw == null ? r.power_kw : r.max_power_kw);
    levelSet.add(r.battery_level);
  }
  levels = [...levelSet].sort((a, b) => a - b);
  series = [...byId.values()].map((s, i) => ({ ...s, color: "var(--series-" + ((i % 6) + 1) + ")" }));
}

/* Average power over the samples between 20% and 80%, the fairest single
   number for comparing sessions; null when a session never reached that band. */
function avg20to80(s) {
  const vals = [...s.byLevel.entries()].filter(([l]) => l >= 20 && l <= 80).map(([, p]) => p.kw);
  return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
}

function renderStats() {
  const stats = [[String(series.length), "Sessions"]];
  let best = null;
  for (const s of series) if (!best || s.peak > best.peak) best = s;
  if (best) stats.push([best.peak + " kW", "Highest peak · " + best.label.split(" · ")[0]]);
  let fastest = null, fastestAvg = null;
  for (const s of series) {
    const a = avg20to80(s);
    if (a != null && (fastestAvg == null || a > fastestAvg)) { fastest = s; fastestAvg = a; }
  }
  if (fastest) stats.push([fastestAvg.toFixed(0) + " kW", "Best 20–80% average · " + fastest.label.split(" · ")[0]]);
  const box = document.getElementById("stats");
  box.replaceChildren(...stats.map(([v, l]) => {
    const d = document.createElement("div");
    d.className = "stat";
    const dv = document.createElement("div"); dv.className = "v"; dv.textContent = v;
    const dl = document.createElement("div"); dl.className = "l"; dl.textContent = l;
    d.append(dv, dl);
    return d;
  }));
  setText("subtitle", "Charging power by battery level · " + series.length
    + (series.length === 1 ? " session" : " sessions"));
}

function renderLegend() {
  const box = document.getElementById("legend");
  box.replaceChildren(...series.map((s) => {
    const item = document.createElement("div"); item.className = "item";
    const key = document.createElement("span"); key.className = "key";
    key.style.borderTopColor = s.color;
    const lab = document.createElement("span");
    lab.textContent = s.label + (s.type ? " (" + s.type + ")" : "");
    const peak = document.createElement("span"); peak.className = "peak";
    peak.textContent = "peak " + s.peak + " kW";
    item.append(key, lab, peak);
    return item;
  }));
}

function renderTable() {
  const cols = ["Battery %"].concat(series.map((s) => "#" + s.id + " kW"));
  const table = document.createElement("table");
  const thead = document.createElement("thead");
  const hr = document.createElement("tr");
  hr.append(...cols.map((label) => {
    const th = document.createElement("th"); th.textContent = label; return th;
  }));
  thead.append(hr);
  const tbody = document.createElement("tbody");
  for (const level of levels) {
    const tr = document.createElement("tr");
    const cells = [level].concat(series.map((s) => {
      const p = s.byLevel.get(level);
      return p ? p.kw : "–";
    }));
    for (const v of cells) {
      const td = document.createElement("td");
      td.textContent = String(v);
      tr.append(td);
    }
    tbody.append(tr);
  }
  table.append(thead, tbody);
  document.getElementById("tableBox").replaceChildren(table);
}

/* ---------- chart ---------- */
const NS = "http://www.w3.org/2000/svg";
const M = { left: 46, right: 14, top: 18, xAxis: 28 };
const PANEL_H = 210;
let geom = null;

function el(name, attrs) {
  const node = document.createElementNS(NS, name);
  for (const k in attrs) node.setAttribute(k, attrs[k]);
  return node;
}
function niceTicks(min, max, count) {
  if (min === max) { min -= 1; max += 1; }
  const span = max - min;
  const step0 = span / Math.max(1, count);
  const mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 5, 10].map((m) => m * mag).find((s) => span / s <= count) || 10 * mag;
  const lo = Math.floor(min / step) * step;
  const ticks = [];
  for (let v = lo; v <= max + 1e-9; v += step) if (v >= min - 1e-9) ticks.push(+v.toFixed(6));
  return ticks;
}

/* Split a series into runs of consecutive levels, so a gap in the samples
   (a level the car skipped) breaks the line instead of bridging it. */
function runs(s) {
  const out = [];
  let cur = [];
  let prev = null;
  for (const level of levels) {
    if (!s.byLevel.has(level)) continue;
    if (prev != null && level - prev > 3) { out.push(cur); cur = []; }
    cur.push(level);
    prev = level;
  }
  if (cur.length) out.push(cur);
  return out;
}

function render() {
  if (!levels.length) { reportSize(); return; }
  const svg = document.getElementById("chart");
  const width = Math.max(280, svg.parentElement.clientWidth || 280);
  const height = M.top + PANEL_H + M.xAxis;
  svg.setAttribute("viewBox", "0 0 " + width + " " + height);
  svg.setAttribute("height", height);
  svg.replaceChildren();

  const lo = Math.max(0, Math.floor(levels[0] / 10) * 10);
  const hi = Math.min(100, Math.ceil(levels[levels.length - 1] / 10) * 10);
  const plotW = width - M.left - M.right;
  const x = (l) => M.left + (hi === lo ? plotW / 2 : ((l - lo) / (hi - lo)) * plotW);

  let maxKw = 0;
  for (const s of series) for (const p of s.byLevel.values()) maxKw = Math.max(maxKw, p.kw);
  const domain = [0, Math.max(10, maxKw * 1.08)];
  const y = (v) => M.top + PANEL_H - ((v - domain[0]) / (domain[1] - domain[0])) * PANEL_H;
  geom = { x, y, width, height };

  const title = el("text", { x: M.left, y: M.top - 6, class: "panel-title" });
  title.textContent = "Charging power (kW)";
  svg.append(title);
  for (const tv of niceTicks(domain[0], domain[1], 5)) {
    if (Math.abs(y(tv) - (M.top + PANEL_H)) > 4) {
      svg.append(el("line", { x1: M.left, x2: width - M.right, y1: y(tv), y2: y(tv), class: "grid-line" }));
    }
    const lab = el("text", { x: M.left - 6, y: y(tv) + 3, "text-anchor": "end", class: "tick-label" });
    lab.textContent = String(tv);
    svg.append(lab);
  }
  svg.append(el("line", {
    x1: M.left, x2: width - M.right, y1: M.top + PANEL_H, y2: M.top + PANEL_H, class: "base-line",
  }));

  for (const s of series) {
    for (const run of runs(s)) {
      const d = run
        .map((l, i) => (i ? "L" : "M") + x(l).toFixed(1) + " " + y(s.byLevel.get(l).kw).toFixed(1))
        .join(" ");
      if (run.length === 1) {
        svg.append(el("circle", { cx: x(run[0]), cy: y(s.byLevel.get(run[0]).kw), r: 2, fill: s.color }));
      } else {
        svg.append(el("path", { d, class: "series-line", stroke: s.color }));
      }
    }
  }

  for (const tv of niceTicks(lo, hi, Math.max(2, Math.floor(plotW / 60)))) {
    const lab = el("text", {
      x: x(tv), y: M.top + PANEL_H + 15, "text-anchor": "middle", class: "tick-label",
    });
    lab.textContent = tv + "%";
    svg.append(lab);
  }
  const axisTitle = el("text", {
    x: width - M.right, y: M.top + PANEL_H + 27, "text-anchor": "end", class: "tick-label",
  });
  axisTitle.textContent = "Battery level";
  svg.append(axisTitle);

  const hover = el("g", { id: "hoverLayer", style: "display:none" });
  hover.append(el("line", { id: "crosshair", y1: M.top, y2: M.top + PANEL_H, class: "crosshair" }));
  series.forEach((s, i) => {
    hover.append(el("circle", { id: "dot-" + i, r: 4, fill: s.color, class: "hover-dot" }));
  });
  svg.append(hover);
  bindPointer(svg);
  if (hoverIndex >= 0) showHover(hoverIndex);
  reportSize();
}

function bindPointer(svg) {
  svg.onpointermove = (ev) => {
    const rect = svg.getBoundingClientRect();
    const px = ((ev.clientX - rect.left) / rect.width) * geom.width;
    let best = 0, bestDist = Infinity;
    levels.forEach((l, i) => {
      const d = Math.abs(geom.x(l) - px);
      if (d < bestDist) { bestDist = d; best = i; }
    });
    showHover(best);
  };
  svg.onpointerleave = () => hideHover();
  svg.onkeydown = (ev) => {
    const last = levels.length - 1;
    let i = hoverIndex < 0 ? 0 : hoverIndex;
    if (ev.key === "ArrowRight") i = Math.min(last, i + 1);
    else if (ev.key === "ArrowLeft") i = Math.max(0, i - 1);
    else if (ev.key === "Home") i = 0;
    else if (ev.key === "End") i = last;
    else if (ev.key === "Escape") { hideHover(); return; }
    else return;
    ev.preventDefault();
    showHover(i);
  };
}

function showHover(i) {
  hoverIndex = i;
  const level = levels[i];
  const cx = geom.x(level);
  const layer = document.getElementById("hoverLayer");
  layer.style.display = "";
  const cross = document.getElementById("crosshair");
  cross.setAttribute("x1", cx); cross.setAttribute("x2", cx);
  const tip = document.getElementById("tooltip");
  tip.replaceChildren();
  const t = document.createElement("div"); t.className = "t"; t.textContent = "Battery " + level + "%";
  tip.append(t);
  series.forEach((s, si) => {
    const dot = document.getElementById("dot-" + si);
    const p = s.byLevel.get(level);
    if (!p) { dot.style.display = "none"; return; }
    dot.style.display = "";
    dot.setAttribute("cx", cx); dot.setAttribute("cy", geom.y(p.kw));
    const row = document.createElement("div"); row.className = "row";
    const key = document.createElement("span"); key.className = "key";
    key.style.borderTopColor = s.color;
    const v = document.createElement("span"); v.className = "val";
    v.textContent = p.kw + " kW";
    const l = document.createElement("span"); l.className = "lab"; l.textContent = s.label;
    row.append(key, v, l);
    tip.append(row);
  });
  tip.style.display = "block";
  const wrap = document.getElementById("chartWrap");
  const svgEl = document.getElementById("chart");
  const scale = svgEl.getBoundingClientRect().width / geom.width;
  const pxLeft = cx * scale;
  const flip = pxLeft > wrap.clientWidth - tip.offsetWidth - 20;
  tip.style.left = (flip ? pxLeft - tip.offsetWidth - 10 : pxLeft + 10) + "px";
  tip.style.top = "24px";
}
function hideHover() {
  hoverIndex = -1;
  document.getElementById("hoverLayer").style.display = "none";
  document.getElementById("tooltip").style.display = "none";
}

/* ---------- sizing ---------- */
let sizeRaf = 0;
function reportSize() {
  cancelAnimationFrame(sizeRaf);
  sizeRaf = requestAnimationFrame(() => {
    notify("ui/notifications/size-changed", {
      width: document.documentElement.scrollWidth,
      height: document.documentElement.scrollHeight,
    });
  });
}
new ResizeObserver(() => { if (levels.length) render(); else reportSize(); })
  .observe(document.getElementById("root"));
document.getElementById("tableWrap").addEventListener("toggle", reportSize);
</script>
</body>
</html>
