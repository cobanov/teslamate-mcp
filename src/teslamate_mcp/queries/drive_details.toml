name = "get_drive_details"
description = "Full statistics for one specific drive by its drive_id (find ids with search_drives): timestamps, distance km, duration, average/max speed, power extremes, inside/outside temperature °C, ascent and descent m, odometer start/end, rated and ideal range used km, range-based consumption %, start/end locations, and start/end geo-fence names."

[[params]]
name = "drive_id"
type = "integer"
description = "The drive's id, as returned by search_drives or get_longest_drives_by_distance."
required = true

[[output]]
name = "drive_id"
type = "integer"

[[output]]
name = "car_name"
type = "string"

[[output]]
name = "start_date"
type = "string"

[[output]]
name = "end_date"
type = "string"

[[output]]
name = "distance_km"
type = "number"

[[output]]
name = "duration_min"
type = "integer"

[[output]]
name = "avg_speed_kmh"
type = "number"

[[output]]
name = "speed_max"
type = "integer"

[[output]]
name = "power_max"
type = "integer"

[[output]]
name = "power_min"
type = "integer"

[[output]]
name = "inside_temp_avg"
type = "number"

[[output]]
name = "outside_temp_avg"
type = "number"

[[output]]
name = "odometer_start_km"
type = "number"

[[output]]
name = "odometer_end_km"
type = "number"

[[output]]
name = "start_rated_range_km"
type = "number"

[[output]]
name = "end_rated_range_km"
type = "number"

[[output]]
name = "rated_range_used_km"
type = "number"

[[output]]
name = "consumption_pct"
type = "number"

[[output]]
name = "start_location"
type = "string"

[[output]]
name = "start_city"
type = "string"

[[output]]
name = "end_location"
type = "string"

[[output]]
name = "end_city"
type = "string"

[[output]]
name = "ascent_m"
type = "integer"
description = "Total climb in meters (GPS elevation noise inflates it; ascent_m - descent_m is the reliable net climb)."

[[output]]
name = "descent_m"
type = "integer"

[[output]]
name = "start_ideal_range_km"
type = "number"

[[output]]
name = "end_ideal_range_km"
type = "number"

[[output]]
name = "ideal_range_used_km"
type = "number"

[[output]]
name = "start_geofence"
type = "string"
description = "Geo-fence TeslaMate stored at the start of the drive. Null outside every fence."

[[output]]
name = "end_geofence"
type = "string"
description = "Geo-fence TeslaMate stored at the end of the drive. Null outside every fence."
