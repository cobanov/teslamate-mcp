name = "search_drives"
description = "Search individual drives (trips) with flexible filters: date range (local calendar dates), car, distance bounds (km), and free-text location match against start/end address or city. Returns drive_id (usable with get_drive_details), timestamps, distance km, duration, max speed, locations, rated range used, and consumption in Wh/km against what this car usually uses at the same outside temperature (vs_expected_pct: positive means it used more). Newest first by default; 50 rows max by default."

[[params]]
name = "car_name"
type = "string"
description = "Case-insensitive substring match on the car's name. Omit for all cars."

[[params]]
name = "start_date"
type = "string"
description = "Earliest local calendar date to include, ISO format (YYYY-MM-DD)."

[[params]]
name = "end_date"
type = "string"
description = "Latest local calendar date to include, ISO format (YYYY-MM-DD)."

[[params]]
name = "min_distance_km"
type = "number"
description = "Only drives at least this many kilometers long."
minimum = 0

[[params]]
name = "max_distance_km"
type = "number"
description = "Only drives at most this many kilometers long."
minimum = 0

[[params]]
name = "location"
type = "string"
description = "Case-insensitive substring matched against start/end address names and cities."

[[params]]
name = "limit"
type = "integer"
description = "Maximum number of rows returned."
default = 50
minimum = 1
maximum = 500

[[params]]
name = "order_by"
type = "string"
description = "Sort order: newest first (start_date), longest first (distance), or slowest first (duration)."
default = "start_date"
enum = ["start_date", "distance", "duration"]

[[output]]
name = "drive_id"
type = "integer"

[[output]]
name = "car_name"
type = "string"

[[output]]
name = "start_date"
type = "string"

[[output]]
name = "end_date"
type = "string"

[[output]]
name = "distance_km"
type = "number"

[[output]]
name = "duration_min"
type = "integer"

[[output]]
name = "speed_max"
type = "integer"

[[output]]
name = "start_location"
type = "string"

[[output]]
name = "start_city"
type = "string"

[[output]]
name = "end_location"
type = "string"

[[output]]
name = "end_city"
type = "string"

[[output]]
name = "outside_temp_avg"
type = "number"

[[output]]
name = "rated_range_used_km"
type = "number"

[[output]]
name = "wh_per_km"
type = "number"
description = "Consumption: rated range used x the car's efficiency, per km. Null under 1 km."

[[output]]
name = "expected_wh_per_km"
type = "number"
description = "This car's median consumption over its other drives of 5 km or more within 3 °C of this drive's outside temperature. Null with fewer than 3 such drives."

[[output]]
name = "vs_expected_pct"
type = "number"
description = "wh_per_km against expected_wh_per_km, in percent. Above +20 is a costly drive for the weather (speed, climbing, short hops, heating); below -15 an easy one. Short drives swing widely."

[[output]]
name = "expected_basis_drives"
type = "integer"
description = "How many drives expected_wh_per_km rests on."
