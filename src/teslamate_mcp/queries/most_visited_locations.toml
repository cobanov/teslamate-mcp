name = "get_most_visited_locations"
description = "Most visited locations across the whole fleet: address, city, state, visit count (drives starting or ending there), and the minutes spent driving on those drives (not time parked there; get_visited_places has parked hours and coordinates). Returns the top 15 locations by default. Optional filters: car_name, days, limit."

[[params]]
name = "car_name"
type = "string"
description = "Case-insensitive substring match on the car's name. Omit for all cars."

[[params]]
name = "days"
type = "integer"
description = "Restrict to the last N days. Omit for all time."
minimum = 1

[[params]]
name = "limit"
type = "integer"
description = "Maximum number of rows returned."
default = 15
minimum = 1
maximum = 100

[[output]]
name = "location"
type = "string"

[[output]]
name = "city"
type = "string"

[[output]]
name = "state"
type = "string"

[[output]]
name = "visit_count"
type = "integer"

[[output]]
name = "total_time_spent_min"
type = "integer"
description = "Total duration of the drives that started or ended there, in minutes: driving time, not time parked."
