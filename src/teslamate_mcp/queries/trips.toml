name = "get_trips"
description = "Group drives into trips. TeslaMate ends a drive every time the car parks, so one journey (e.g. Istanbul to Ankara with a WC break and a Supercharger stop) is several drives; this merges consecutive drives of a car while each stop in between stays short: up to max_stop_minutes (default 30) without charging, or max_charging_stop_minutes (default 120) when a charging session happened during the stop. Returns one row per trip: trip_id (use with get_trip_details and show_trip_route), start/end time and place, legs, stops and charging stops, distance km, driving vs stopped vs total minutes, average moving speed, battery % at start and end, kWh added during the trip, rated range used, average outside temperature, ascent and descent m. Newest first by default; 20 rows by default. Filter on the trip's local start date, car, distance, number of legs, or a place the trip passed through."

[[params]]
name = "car_name"
type = "string"
description = "Case-insensitive substring match on the car's name. Omit for all cars."

[[params]]
name = "start_date"
type = "string"
description = "Earliest local calendar date the trip may start on, ISO format (YYYY-MM-DD)."

[[params]]
name = "end_date"
type = "string"
description = "Latest local calendar date the trip may start on, ISO format (YYYY-MM-DD)."

[[params]]
name = "min_distance_km"
type = "number"
description = "Only trips at least this many kilometers long in total."
minimum = 0

[[params]]
name = "min_legs"
type = "integer"
description = "Only trips with at least this many drives (2 = trips that had at least one stop)."
minimum = 1

[[params]]
name = "location"
type = "string"
description = "Case-insensitive substring matched against the address names and cities of every leg's start and end, so a trip matches a place it stopped at, not only its endpoints."

[[params]]
name = "limit"
type = "integer"
description = "Maximum number of trips returned."
default = 20
minimum = 1
maximum = 200

[[params]]
name = "order_by"
type = "string"
description = "Sort order: newest first (start_date), longest first (distance), or longest elapsed time first (duration)."
default = "start_date"
enum = ["start_date", "distance", "duration"]

[[params]]
name = "max_stop_minutes"
type = "integer"
description = "Longest stop without charging (WC, food) that still counts as the same trip, in minutes. A longer stop starts a new trip."
default = 30
minimum = 1
maximum = 1440

[[params]]
name = "max_charging_stop_minutes"
type = "integer"
description = "Longest stop with a charging session in it that still counts as the same trip, in minutes (covers a fast charge plus a meal). Overnight and home charging normally exceed it and end the trip."
default = 120
minimum = 1
maximum = 1440

[[output]]
name = "trip_id"
type = "integer"
description = "The trip's first drive id; pass it to get_trip_details or show_trip_route."

[[output]]
name = "car_name"
type = "string"

[[output]]
name = "start_date"
type = "string"
description = "Start of the first drive (UTC)."

[[output]]
name = "end_date"
type = "string"
description = "End of the last drive (UTC)."

[[output]]
name = "legs"
type = "integer"
description = "Number of drives merged into the trip."

[[output]]
name = "stops"
type = "integer"
description = "Stops between drives (legs - 1)."

[[output]]
name = "charging_stops"
type = "integer"
description = "Stops that contained a charging session."

[[output]]
name = "distance_km"
type = "number"

[[output]]
name = "driving_min"
type = "integer"
description = "Minutes spent driving (sum of the drives' durations)."

[[output]]
name = "total_min"
type = "integer"
description = "Elapsed minutes from the first departure to the last arrival."

[[output]]
name = "stopped_min"
type = "integer"
description = "Minutes spent in stops between drives."

[[output]]
name = "avg_moving_speed_kmh"
type = "number"
description = "Distance over driving time, excluding stops."

[[output]]
name = "speed_max_kmh"
type = "integer"

[[output]]
name = "start_location"
type = "string"

[[output]]
name = "start_city"
type = "string"

[[output]]
name = "end_location"
type = "string"

[[output]]
name = "end_city"
type = "string"

[[output]]
name = "start_battery_level"
type = "integer"
description = "Battery % at the first logged position of the trip."

[[output]]
name = "end_battery_level"
type = "integer"
description = "Battery % at the last logged position of the trip."

[[output]]
name = "energy_added_kwh"
type = "number"
description = "kWh added by charging sessions during the trip's stops (null when none)."

[[output]]
name = "rated_range_used_km"
type = "number"
description = "Rated range consumed while driving (sum over the legs; charging excluded)."

[[output]]
name = "outside_temp_avg"
type = "number"
description = "Driving-time-weighted average outside temperature (degrees C)."

[[output]]
name = "ascent_m"
type = "integer"
description = "Total climb over the trip's drives, in meters (inflated by GPS elevation noise)."

[[output]]
name = "descent_m"
type = "integer"
