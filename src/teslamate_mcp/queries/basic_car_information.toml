name = "get_basic_car_information"
description = "Basic information for each car: name, model, trim badging, exterior color, marketing name, and whether logging and free supercharging are enabled. Optional filters: car_name."

[[params]]
name = "car_name"
type = "string"
description = "Case-insensitive substring match on the car's name. Omit for all cars."

[[output]]
name = "name"
type = "string"

[[output]]
name = "model"
type = "string"

[[output]]
name = "trim_badging"
type = "string"

[[output]]
name = "exterior_color"
type = "string"

[[output]]
name = "marketing_name"
type = "string"

[[output]]
name = "enabled"
type = "boolean"

[[output]]
name = "free_supercharging"
type = "boolean"
