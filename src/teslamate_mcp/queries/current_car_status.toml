name = "get_current_car_status"
description = "Returns the latest recorded snapshot per car: what the car is doing now (car_state: driving, charging, online, asleep, or offline) and since when, battery level (%), rated range (km), odometer (km), outside temperature (°C), climate state, GPS coordinates, nearest address, and last-update timestamp. Also returns the cabin climate (inside temperature and setpoints in °C, fan, defrosters) and the four tire pressures (bar). Most in-drive rows carry neither, so each group comes from the latest row that has it, up to 7 days before last_update; climate_at and tpms_at give that row's time. When last_update is old, TeslaMate has lost contact with the car and car_state is stale. Optional filters: car_name."

[[params]]
name = "car_name"
type = "string"
description = "Case-insensitive substring match on the car's name. Omit for all cars."

[[output]]
name = "car_name"
type = "string"

[[output]]
name = "battery_level"
type = "integer"

[[output]]
name = "rated_battery_range_km"
type = "number"

[[output]]
name = "odometer"
type = "number"

[[output]]
name = "outside_temp"
type = "number"

[[output]]
name = "is_climate_on"
type = "boolean"

[[output]]
name = "inside_temp"
type = "number"
description = "Cabin temperature (°C) from the latest row that has climate data."

[[output]]
name = "driver_temp_setting"
type = "number"
description = "Driver setpoint (°C), from the same row as inside_temp."

[[output]]
name = "passenger_temp_setting"
type = "number"
description = "Passenger setpoint (°C), from the same row as inside_temp."

[[output]]
name = "fan_status"
type = "integer"
description = "Fan speed step, 0 when off. From the same row as inside_temp."

[[output]]
name = "is_front_defroster_on"
type = "boolean"

[[output]]
name = "is_rear_defroster_on"
type = "boolean"

[[output]]
name = "climate_at"
type = "string"
description = "Time of the row that gave the climate columns (UTC). Null when no row in the 7 days before last_update has climate data."

[[output]]
name = "tpms_pressure_fl"
type = "number"
description = "Front-left tire pressure, bar."

[[output]]
name = "tpms_pressure_fr"
type = "number"
description = "Front-right tire pressure, bar."

[[output]]
name = "tpms_pressure_rl"
type = "number"
description = "Rear-left tire pressure, bar."

[[output]]
name = "tpms_pressure_rr"
type = "number"
description = "Rear-right tire pressure, bar."

[[output]]
name = "tpms_at"
type = "string"
description = "Time of the row that gave the tire pressures (UTC). Null when no row in the 7 days before last_update has a tire value."

[[output]]
name = "latitude"
type = "number"

[[output]]
name = "longitude"
type = "number"

[[output]]
name = "location"
type = "string"

[[output]]
name = "city"
type = "string"

[[output]]
name = "state"
type = "string"
description = "State or region of the nearest address (not the car's state; see car_state)."

[[output]]
name = "last_update"
type = "string"

[[output]]
name = "car_state"
type = "string"
description = "driving, charging, online (awake, parked), asleep, or offline, from TeslaMate's state log."

[[output]]
name = "car_state_since"
type = "string"
description = "When the current car_state began (UTC)."
