name = "get_current_car_status"
description = "Returns the latest recorded snapshot per car: what the car is doing now (car_state: driving, charging, online, asleep, or offline) and since when, battery level (%), rated range (km), odometer (km), outside temperature (°C), climate state, GPS coordinates, nearest address, and last-update timestamp. When last_update is old, TeslaMate has lost contact with the car and car_state is stale. Optional filters: car_name."

[[params]]
name = "car_name"
type = "string"
description = "Case-insensitive substring match on the car's name. Omit for all cars."

[[output]]
name = "car_name"
type = "string"

[[output]]
name = "battery_level"
type = "integer"

[[output]]
name = "rated_battery_range_km"
type = "number"

[[output]]
name = "odometer"
type = "number"

[[output]]
name = "outside_temp"
type = "number"

[[output]]
name = "is_climate_on"
type = "boolean"

[[output]]
name = "latitude"
type = "number"

[[output]]
name = "longitude"
type = "number"

[[output]]
name = "location"
type = "string"

[[output]]
name = "city"
type = "string"

[[output]]
name = "state"
type = "string"
description = "State or region of the nearest address (not the car's state; see car_state)."

[[output]]
name = "last_update"
type = "string"

[[output]]
name = "car_state"
type = "string"
description = "driving, charging, online (awake, parked), asleep, or offline, from TeslaMate's state log."

[[output]]
name = "car_state_since"
type = "string"
description = "When the current car_state began (UTC)."
