name = "get_monthly_driving_summary"
description = "Per-car monthly driving summary: trip count, total and average distance (km), total driving time (minutes), average outside temperature (°C), and max speed, bucketed by calendar month in the report timezone. Covers all time by default. Optional filters: car_name, days."

[[params]]
name = "car_name"
type = "string"
description = "Case-insensitive substring match on the car's name. Omit for all cars."

[[params]]
name = "days"
type = "integer"
description = "Restrict to the last N days. Omit for all time."
minimum = 1

[[output]]
name = "car_name"
type = "string"

[[output]]
name = "month"
type = "string"

[[output]]
name = "total_trips"
type = "integer"

[[output]]
name = "total_distance_km"
type = "number"

[[output]]
name = "avg_trip_distance_km"
type = "number"

[[output]]
name = "total_driving_time_min"
type = "integer"

[[output]]
name = "avg_outside_temp"
type = "number"

[[output]]
name = "max_speed_reached"
type = "integer"
